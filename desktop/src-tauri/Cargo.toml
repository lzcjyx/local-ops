[package]
name = "console-desktop"
version = "1.0.0"
description = "总控台桌面壳（ADCC Core 客户端，不承载运行时逻辑）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
